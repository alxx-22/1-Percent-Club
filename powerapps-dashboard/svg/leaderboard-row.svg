<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 920 84' width='920' height='84'><defs><filter id='blur' x='-20%' y='-20%' width='140%' height='140%'><feGaussianBlur stdDeviation='5'/></filter></defs><style>.fu{animation:fu .55s cubic-bezier(.2,.7,.2,1) both}.fo{animation:fo .5s ease-out both}.pp{animation:pp .5s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:center}.gx{animation:gx .65s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:left center}.rw{animation:rw .5s cubic-bezier(.2,.7,.2,1) both}.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.8s ease-out infinite}.brz{animation:brz 2.6s ease-in-out infinite}@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes fo{from{opacity:0}to{opacity:1}}@keyframes pp{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes rw{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}@keyframes ring{0%{opacity:.45;transform:scale(.75)}70%{opacity:0;transform:scale(2)}100%{opacity:0;transform:scale(2)}}@keyframes brz{0%,100%{opacity:.9}50%{opacity:.45}}@media(prefers-reduced-motion:reduce){.fu,.fo,.pp,.gx,.rw,.ring,.brz{animation:none}}</style><g class='rw' style='animation-delay:0.00s'><rect x='4' y='12' width='912' height='64' rx='12' fill='#000000' opacity='0.07' filter='url(#blur)'/><rect x='4' y='8' width='912' height='64' rx='12' fill='#ffffff' stroke='#d4d8db'/><rect x='22' y='18' width='44' height='44' rx='10' fill='#f2f3f4'/><text x='44' y='40' font-family='Liberation Sans, Arial, Helvetica, sans-serif' font-size='20' font-weight='700' fill='#292d3a' text-anchor='middle' dominant-baseline='central'>4</text><text x='86' y='37' font-family='Liberation Sans, Arial, Helvetica, sans-serif' font-size='21' font-weight='700' fill='#292d3a'>Crew 10</text><rect x='86' y='50' width='460' height='7' rx='3.5' fill='#f2f3f4'/><rect x='86' y='50' width='333' height='7' rx='3.5' fill='#01a982' class='gx' style='animation-delay:0.25s'/><line x1='735' y1='22' x2='735' y2='58' stroke='#d4d8db'/><text x='820' y='44' font-family='Liberation Sans, Arial, Helvetica, sans-serif' font-size='30' font-weight='700' fill='#292d3a' text-anchor='end'>420</text><text x='828' y='44' font-family='Liberation Sans, Arial, Helvetica, sans-serif' font-size='13' font-weight='600' fill='#606a70'>pts</text><text x='890' y='62' font-family='Liberation Sans, Arial, Helvetica, sans-serif' font-size='12.5' fill='#606a70' text-anchor='end'>no pending</text></g></svg>