<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 668 30' width='668' height='30'><defs><filter id='blur' x='-20%' y='-20%' width='140%' height='140%'><feGaussianBlur stdDeviation='5'/></filter></defs><style>.fu{animation:fu .55s cubic-bezier(.2,.7,.2,1) both}.fo{animation:fo .5s ease-out both}.pp{animation:pp .5s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:center}.gx{animation:gx .65s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:left center}.rw{animation:rw .5s cubic-bezier(.2,.7,.2,1) both}.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.8s ease-out infinite}.brz{animation:brz 2.6s ease-in-out infinite}@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes fo{from{opacity:0}to{opacity:1}}@keyframes pp{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes rw{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}@keyframes ring{0%{opacity:.45;transform:scale(.75)}70%{opacity:0;transform:scale(2)}100%{opacity:0;transform:scale(2)}}@keyframes brz{0%,100%{opacity:.9}50%{opacity:.45}}@media(prefers-reduced-motion:reduce){.fu,.fo,.pp,.gx,.rw,.ring,.brz,.scrl{animation:none}}</style><g class='rw' style='animation-delay:0.16s'><rect x='2' y='2' width='664' height='26' rx='8' fill='#d1ffee' stroke='#01a982' stroke-width='2'/><rect x='2' y='2' width='5' height='26' rx='2.5' fill='#01a982'/><rect x='10' y='5' width='20' height='20' rx='6' fill='#01a982'/><text x='20' y='15' font-family='Liberation Sans, Arial, Helvetica, sans-serif' font-size='11' font-weight='700' fill='#ffffff' text-anchor='middle' dominant-baseline='central'>6</text><text x='40' y='19' font-family='Liberation Sans, Arial, Helvetica, sans-serif' font-size='13' font-weight='700' fill='#006750'>Crew 1</text><rect x='90' y='8' width='79' height='14' rx='7' fill='#d1ffee' stroke='#01a982'/><text x='130' y='15' font-family='Liberation Sans, Arial, Helvetica, sans-serif' font-size='8.5' font-weight='700' letter-spacing='.3' fill='#006750' text-anchor='middle' dominant-baseline='central'>YOUR CREW</text><rect x='300' y='12' width='150' height='6' rx='3' fill='#f2f3f4'/><rect x='300' y='12' width='96' height='6' rx='3' fill='#01a982' class='gx' style='animation-delay:0.41s'/><text x='598' y='20' font-family='Liberation Sans, Arial, Helvetica, sans-serif' font-size='16' font-weight='700' fill='#292d3a' text-anchor='end'>370</text><text x='602' y='20' font-family='Liberation Sans, Arial, Helvetica, sans-serif' font-size='10' font-weight='600' fill='#606a70'>pts</text></g></svg>