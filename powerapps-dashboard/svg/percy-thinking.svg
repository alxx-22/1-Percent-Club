<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 40' width='200' height='40'><rect x='0' y='0' width='200' height='40' fill='#f7f7f7'/><style>.d{transform-box:fill-box;transform-origin:center;animation:db 1.2s ease-in-out infinite}@keyframes db{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-3px);opacity:1}}.tin{transform-box:fill-box;transform-origin:0% 100%;animation:tin .3s cubic-bezier(.2,.7,.2,1) both}@keyframes tin{from{opacity:0;transform:translateY(8px) scale(.92)}to{opacity:1;transform:none}}.tout{transform-box:fill-box;transform-origin:0% 100%;animation:tout .25s ease-in both}@keyframes tout{from{opacity:1;transform:none}to{opacity:0;transform:translateY(6px) scale(.94)}}@media(prefers-reduced-motion:reduce){.d,.tin,.tout{animation:none}}</style><g class='tin'><rect x='1' y='6' width='170' height='30' rx='15' fill='#ffffff' stroke='#d4d8db'/><circle cx='19' cy='21' r='10' fill='#01a982'/><circle cx='15.5' cy='21' r='1.7' fill='#7cf5cf'/><circle cx='22.5' cy='21' r='1.7' fill='#7cf5cf'/><text x='36' y='25' font-family='Liberation Sans, Arial, Helvetica, sans-serif' font-size='12' font-weight='600' fill='#3e4550'>Percy is thinking</text><circle class='d' style='animation-delay:0.00s' cx='144' cy='21' r='2.6' fill='#606a70'/><circle class='d' style='animation-delay:0.15s' cx='153' cy='21' r='2.6' fill='#606a70'/><circle class='d' style='animation-delay:0.30s' cx='162' cy='21' r='2.6' fill='#606a70'/></g></svg>