<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 132 30' width='132' height='30'><style>.fu{animation:fu .55s cubic-bezier(.2,.7,.2,1) both}.fo{animation:fo .5s ease-out both}.pp{animation:pp .5s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:center}.gx{animation:gx .65s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:left center}.rw{animation:rw .5s cubic-bezier(.2,.7,.2,1) both}.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.8s ease-out infinite}.brz{animation:brz 2.6s ease-in-out infinite}.bob{transform-box:fill-box;transform-origin:center;animation:bob 2.4s ease-in-out infinite}@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes fo{from{opacity:0}to{opacity:1}}@keyframes pp{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes rw{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}@keyframes ring{0%{opacity:.45;transform:scale(.75)}70%{opacity:0;transform:scale(2)}100%{opacity:0;transform:scale(2)}}@keyframes brz{0%,100%{opacity:.9}50%{opacity:.45}}@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-2px) rotate(4deg)}}@media(prefers-reduced-motion:reduce){.fu,.fo,.pp,.gx,.rw,.ring,.brz,.scrl,.bob{animation:none}}</style><style>.nudgeL{animation:nudgeL 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes nudgeL{0%,100%{transform:translateX(0)}50%{transform:translateX(-3px)}}@media(prefers-reduced-motion:reduce){.nudgeL{animation:none}}</style><g class='fu'><rect x='1' y='1' width='130' height='28' rx='14' fill='#f2f3f4' stroke='#d4d8db'/><path d='M26,9 l-6,6 l6,6' fill='none' stroke='#006750' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' class='nudgeL'/><text x='40' y='16' font-family='Liberation Sans, Arial, Helvetica, sans-serif' font-size='12.5' font-weight='600' fill='#006750' dominant-baseline='central'>Dashboard</text></g></svg>