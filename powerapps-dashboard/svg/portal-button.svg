<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 140 30' width='140' height='30'><style>.fu{animation:fu .55s cubic-bezier(.2,.7,.2,1) both}.fo{animation:fo .5s ease-out both}.pp{animation:pp .5s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:center}.gx{animation:gx .65s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:left center}.rw{animation:rw .5s cubic-bezier(.2,.7,.2,1) both}.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.8s ease-out infinite}.brz{animation:brz 2.6s ease-in-out infinite}.bob{transform-box:fill-box;transform-origin:center;animation:bob 2.4s ease-in-out infinite}@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes fo{from{opacity:0}to{opacity:1}}@keyframes pp{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes rw{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}@keyframes ring{0%{opacity:.45;transform:scale(.75)}70%{opacity:0;transform:scale(2)}100%{opacity:0;transform:scale(2)}}@keyframes brz{0%,100%{opacity:.9}50%{opacity:.45}}@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-2px) rotate(4deg)}}@media(prefers-reduced-motion:reduce){.fu,.fo,.pp,.gx,.rw,.ring,.brz,.scrl,.bob{animation:none}}</style><style>.nudge{animation:nudge 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}@media(prefers-reduced-motion:reduce){.nudge{animation:none}}</style><g class='fu'><rect x='1' y='1' width='138' height='28' rx='14' fill='#01a982'/><rect x='1' y='1' width='138' height='14' rx='13' fill='#ffffff' opacity='.12'/><g transform='translate(20,15)'><path d='M0,-7 C4,-5 4,3 0,7 C-4,3 -4,-5 0,-7 Z' fill='#ffffff' opacity='.95'/><path d='M0,-6 L0,6' stroke='#01a982' stroke-width='.8' opacity='.5'/></g><text x='36' y='16' font-family='Liberation Sans, Arial, Helvetica, sans-serif' font-size='13' font-weight='600' fill='#ffffff' dominant-baseline='central'>Crew Portal</text><path d='M122,11 l5,4 l-5,4' fill='none' stroke='#ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' class='nudge'/></g></svg>