<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 210 116' width='210' height='116'><rect x='0' y='0' width='210' height='116' fill='#ffffff'/><style>.pbob{transform-box:fill-box;transform-origin:center;animation:pbob 3s ease-in-out infinite}@keyframes pbob{0%,100%{transform:translateY(0)}50%{transform:translateY(2.5px)}}.pwave{transform-box:fill-box;transform-origin:50% 95%;animation:pwave 5s ease-in-out infinite}@keyframes pwave{0%,64%,100%{transform:rotate(0)}70%{transform:rotate(24deg)}77%{transform:rotate(-14deg)}84%{transform:rotate(22deg)}91%{transform:rotate(-8deg)}}.pblink{transform-box:fill-box;transform-origin:center;animation:pblink 4.5s infinite}@keyframes pblink{0%,95%,100%{transform:scaleY(1)}97.5%{transform:scaleY(.12)}}.pdot{animation:pdot 1.8s ease-in-out infinite}@keyframes pdot{0%,100%{opacity:.45}50%{opacity:1}}.pb1{opacity:0;transform-box:fill-box;transform-origin:100% 60%;animation:pb1 13s ease-in-out infinite}@keyframes pb1{0%,3%{opacity:0;transform:scale(.7)}7%,22%{opacity:1;transform:scale(1)}27%,100%{opacity:0;transform:scale(.9)}}.pb2{opacity:0;transform-box:fill-box;transform-origin:100% 60%;animation:pb2 13s ease-in-out infinite}@keyframes pb2{0%,52%{opacity:0;transform:scale(.7)}56%,72%{opacity:1;transform:scale(1)}77%,100%{opacity:0;transform:scale(.9)}}@media(prefers-reduced-motion:reduce){.pbob,.pwave,.pblink,.pdot,.pb1,.pb2{animation:none}}</style><g class='pb1'><rect x='6' y='8' width='128' height='44' rx='14' fill='#ffffff' stroke='#d4d8db'/><path d='M126,40 l16,7 l-15,4 z' fill='#ffffff'/><text x='70' y='34' font-family='Liberation Sans, Arial, Helvetica, sans-serif' font-size='12.5' font-weight='600' fill='#292d3a' text-anchor='middle'>Hey, I'm Percy</text></g><g><rect x='6' y='8' width='128' height='44' rx='14' fill='#ffffff' stroke='#d4d8db'/><path d='M126,40 l16,7 l-15,4 z' fill='#ffffff'/><text x='70' y='34' font-family='Liberation Sans, Arial, Helvetica, sans-serif' font-size='12.5' font-weight='600' fill='#292d3a' text-anchor='middle'>Ask me a question!</text></g><g class='pbob'><ellipse cx='170' cy='86' rx='28' ry='4' fill='#000000' opacity='.08'/><line x1='170' y1='30' x2='170' y2='18' stroke='#01a982' stroke-width='3' stroke-linecap='round'/><circle cx='170' cy='14' r='4' fill='#01a982' class='pdot'/><rect x='134' y='72' width='15' height='11' rx='5.5' fill='#018f6e'/><g class='pwave'><rect x='193' y='50' width='13' height='18' rx='6.5' fill='#018f6e'/></g><rect x='142' y='28' width='56' height='54' rx='18' fill='#01a982'/><rect x='150' y='40' width='40' height='32' rx='11' fill='#06372e'/><g class='pblink'><circle cx='161' cy='61' r='4.2' fill='#7cf5cf'/><circle cx='179' cy='61' r='4.2' fill='#7cf5cf'/></g><path d='M163,68 q7,5 14,0' fill='none' stroke='#7cf5cf' stroke-width='1.6' stroke-linecap='round'/></g></svg>