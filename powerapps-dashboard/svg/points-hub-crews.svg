<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1136 640' width='1136' height='640' font-family='Segoe UI, Arial, sans-serif' role='img' aria-label='Points HQ, all-crews view mock'>
  <style>
    .fu{animation:fu .55s cubic-bezier(.2,.7,.2,1) both}
    .fo{animation:fo .5s ease-out both}
    .pp{animation:pp .5s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:center}
    .gx{animation:gx .65s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:left center}
    .rw{animation:rw .5s cubic-bezier(.2,.7,.2,1) both}
    @keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @keyframes fo{from{opacity:0}to{opacity:1}}
    @keyframes pp{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
    @keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes rw{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
    @media(prefers-reduced-motion:reduce){.fu,.fo,.pp,.gx,.rw{animation:none}}
  </style>
  <rect x='0' y='0' width='1136' height='640' fill='#f7f7f7'/>

  <!-- ribbon -->
  <g class='fu'>
    <rect x='0' y='0' width='1136' height='52' fill='#ffffff'/>
    <line x1='0' y1='51' x2='1136' y2='51' stroke='#d4d8db'/>
    <rect x='16' y='11' width='132' height='30' rx='15' fill='#f2f3f4' stroke='#d4d8db'/>
    <path d='M41,19 l-6,7 l6,7' fill='none' stroke='#006750' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/>
    <text x='55' y='30' font-size='12.5' font-weight='600' fill='#006750'>Dashboard</text>
    <rect x='164' y='13' width='26' height='26' rx='7' fill='#006750'/>
    <rect x='170' y='26' width='3.5' height='7' rx='1.2' fill='#ffffff'/>
    <rect x='175.5' y='22' width='3.5' height='11' rx='1.2' fill='#ffffff'/>
    <rect x='181' y='18' width='3.5' height='15' rx='1.2' fill='#ffffff'/>
    <text x='202' y='32' font-size='17' font-weight='700' fill='#292d3a'>Points HQ <tspan fill='#606a70' font-weight='400'>&#183; points by crew &amp; member</tspan></text>
    <rect x='880' y='10' width='240' height='32' rx='16' fill='#f2f3f4'/>
    <circle cx='900' cy='26' r='12' fill='#01a982'/>
    <text x='900' y='27' font-size='10' font-weight='700' fill='#ffffff' text-anchor='middle' dominant-baseline='central'>AS</text>
    <text x='920' y='30' font-size='13' fill='#3e4550'>Alex Smith &#183; Sponsor</text>
  </g>

