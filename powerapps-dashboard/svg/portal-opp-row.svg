<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 420 64' width='420' height='64'><defs><filter id='blur' x='-20%' y='-20%' width='140%' height='140%'><feGaussianBlur stdDeviation='5'/></filter></defs><style>.fu{animation:fu .55s cubic-bezier(.2,.7,.2,1) both}.fo{animation:fo .5s ease-out both}.pp{animation:pp .5s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:center}.gx{animation:gx .65s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:left center}.rw{animation:rw .5s cubic-bezier(.2,.7,.2,1) both}.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.8s ease-out infinite}.brz{animation:brz 2.6s ease-in-out infinite}.bob{transform-box:fill-box;transform-origin:center;animation:bob 2.4s ease-in-out infinite}@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes fo{from{opacity:0}to{opacity:1}}@keyframes pp{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes rw{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}@keyframes ring{0%{opacity:.45;transform:scale(.75)}70%{opacity:0;transform:scale(2)}100%{opacity:0;transform:scale(2)}}@keyframes brz{0%,100%{opacity:.9}50%{opacity:.45}}@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-2px) rotate(4deg)}}@media(prefers-reduced-motion:reduce){.fu,.fo,.pp,.gx,.rw,.ring,.brz,.scrl,.bob{animation:none}}</style><g class='rw' style='animation-delay:0.06s'><rect x='2' y='2' width='416' height='60' rx='11' fill='#d1ffee' stroke='#01a982' stroke-width='2'/><clipPath id='or'><rect x='2' y='2' width='416' height='60' rx='11'/></clipPath><rect x='2' y='2' width='5' height='60' rx='2.5' fill='#0070f8' clip-path='url(#or)'/><text x='16' y='22' font-family='Liberation Sans, Arial, Helvetica, sans-serif' font-size='13' font-weight='700' fill='#292d3a'>Cloud Migration – Phase 2</text><text x='16