Screens:
  scrDashboard:
    Properties:
      Fill: =RGBA(247, 247, 247, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =// ============================================================================
        //  Screen.OnVisible  —  BUILDS ALL DASHBOARD DATA.
        //
        //  CREW IS NOW A NAME (text), not a number. Teams submitted names, so:
        //   - Crew is read as trimmed TEXT. (The old Value() coercion turned every
        //     name into 0 and collapsed the whole board into a single "Crew 0".)
        //   - Ranking: CrewTotal desc, ties alphabetical — done with ONE text SortKey,
        //     because this environment rejects GroupBy/SortByColumns string args.
        //   - CrewName is the name itself (no "Crew " prefix).
        //   - Blank numeric point cells still throw on read -> IfError(pbi.col, 0).
        // ============================================================================

        // 1) members (typed + totals) ---------------------------------------------
        ClearCollect(
            colMembers,
            ForAll(
                PowerBIIntegration.Data As pbi,
                With(
                    { ib:   IfError(pbi.'IB & NS Points', 0),
                      mgr:  IfError(pbi.'Manager Sponsor Points', 0),
                      ncc:  IfError(pbi.'New CC Logo Points', 0),
                      cw:   IfError(pbi.'Cap Won Points', 0),
                      cr:   IfError(pbi.'Cap Requests', 0),
                      cust: IfError(pbi.'Customer Centricity Points', 0),
                      ipg:  IfError(pbi.'IP in GL points', 0),
                      cwp:  IfError(pbi.'Cap Won Points Pending', 0),
                      crp:  IfError(pbi.'Cap Requests Pending', 0),
                      ccp:  IfError(pbi.'Customer Centricity Points Pending', 0),
                      crw:  Trim(pbi.Crew & "") },
                    {
                        Name:          pbi.Name & "",
                        Crew:          If(crw = "", "Unassigned", crw),
                        Role:          pbi.'Job Family' & "",      
                        Email:         Lower(pbi.'User Email' & ""),
                        SponsorEmail:  Lower(pbi.'Manager Sponsor Email' & ""),
                        Sponsor:       pbi.'Manager Sponsor' & "",
                        IBNS:          ib,
                        MgrPts:        mgr,
                        NewCCLogo:     ncc,
                        CapWon:        cw,
                        CapReq:        cr,
                        CustCent:      cust,
                        IPgl:          ipg,
                        MemberTotal:   ib + mgr + ncc + cw + cr + cust + ipg,
                        MemberPending: cwp + crp + ccp
                    }
                )
            )
        );

        // 2) crew totals — one row per distinct crew NAME --------------------------
        //    SortKey: bigger total => smaller key (sorts first ascending). The base is
        //    fixed-width 8 digits so a 0-point crew (99999999) still sorts AFTER higher
        //    totals (99999xxx) instead of before them. Equal totals fall back to name A-Z.
        ClearCollect(
            colCrewAgg,
            ForAll(
                Distinct( colMembers, Crew ) As d,
                With(
                    { f: Filter( colMembers, Crew = d.Value ) },
                    With(
                        { t: Sum( f, MemberTotal ) },
                        { Crew:        d.Value,
                          CrewTotal:   t,
                          CrewPending: Sum( f, MemberPending ),
                          CrewSize:    CountRows( f ),
                          SortKey:     Text( 99999999 - t, "00000000" ) & Lower( d.Value ) }
                    )
                )
            )
        );

        // 2b) rank them (ascending SortKey == total desc, name asc on ties) --------
        ClearCollect(
            colCrew,
            ForAll(
                Sequence( CountRows( colCrewAgg ) ),
                With(
                    { row: Last( FirstN( Sort( colCrewAgg, SortKey ), Value ) ) },
                    { Rank:        Value,
                      Crew:        row.Crew,
                      CrewName:    row.Crew,
                      CrewTotal:   row.CrewTotal,
                      CrewPending: row.CrewPending,
                      CrewSize:    row.CrewSize }
                )
            )
        );
        Set( varLeaderMax, Max( 1, Coalesce( First( colCrew ).CrewTotal, 0 ) ) );  // >=1 so bars never divide by a 0 leader
        ClearCollect( colCrewRest, Filter( colCrew, Rank >= 4 ) );

        // 3) viewer role  (varMyCrew is now the crew NAME) --------------------------
        // was: Set( varUserEmail, Lower( User().Email ) );
        Set( varTestActive, Len( varTestCrew ) > 0 );
        Set( varTestMember,
            If( varTestActive,
                First( Sort( Filter( colMembers, Crew = varTestCrew ), MemberTotal, SortOrder.Descending ) ),
                Blank() ) );
        Set(
            varUserEmail,
            If(
                Or(
                    Lower(User().Email) = "alex.cohen@hpe.com",
                    Lower(User().Email) = "darren_rogers@hpe.com"
                ),
                "dprince@hpe.com",
                Lower(User().Email)
            )
        );
        Set( varMemberRec,  If( varTestActive, varTestMember, LookUp( colMembers, Email = varUserEmail ) ) );
        Set( varSponsorRec, If( varTestActive, Blank(), LookUp( colMembers, SponsorEmail = varUserEmail ) ) );
        Set( varRole,
            If( varTestActive, "member",
                If( !IsBlank( varMemberRec.Name ), "member",
                    If( !IsBlank( varSponsorRec.Name ), "sponsor", "spectator" ) ) ) );
        Set( varMyCrew,
            If( varTestActive, varTestCrew,
                Switch( varRole, "member", varMemberRec.Crew, "sponsor", varSponsorRec.Crew, Blank() ) ) );
        Set( varMyCrewTag, If( varRole = "sponsor", "YOU SPONSOR", "YOUR CREW" ) );
        Set( varDispName,
            Switch( varRole, "member", varMemberRec.Name, "sponsor", varSponsorRec.Sponsor, "Guest Viewer" ) );
        Set( varMyInitials,
            Upper( Left( varDispName, 1 ) & Mid( varDispName & " ", Find( " ", varDispName & " " ) + 1, 1 ) ) );
        Set( varRibbonChip,
            Switch( varRole,
                "member",  varDispName & " · " & varMyCrew,
                "sponsor", varDispName & " · Sponsor",
                "Guest Viewer · Spectator" ) );

        // 4) per-crew category breakdown ------------------------------------------
        ClearCollect(
            colCrewBreak,
            ForAll(
                Sort( colCrew, Rank ) As c,
                With(
                    { f: Filter( colMembers, Crew = c.Crew ) },
                    { Rank: c.Rank, Crew: c.Crew, CrewName: c.CrewName, Total: c.CrewTotal, Pending: c.CrewPending,
                      NewCC:  Sum( f, IBNS + NewCCLogo ),
                      CapEng: Sum( f, CapReq ),
                      CapOrd: Sum( f, CapWon ),
                      CC:     Sum( f, CustCent ),
                      Accred: Sum( f, MgrPts ),
                      IP:     Sum( f, IPgl ) }
                )
            )
        );

        // 5) viewer's crew members (grid), 0-based Idx ----------------------------
        ClearCollect(
            colMyCrewSorted,
            Sort( Filter( colMembers, Crew = varMyCrew ), MemberTotal, SortOrder.Descending )
        );
        ClearCollect(
            colMyCrew,
            ForAll(
                Sequence( CountRows( colMyCrewSorted ) ),
                With( { row: Last( FirstN( colMyCrewSorted, Value ) ) },
                    { Idx: Value - 1, Name: row.Name, MemberTotal: row.MemberTotal,
                      IsMe: row.Email = varUserEmail } )
            )
        );

        // 6) left "box" values -----------------------------------------------------
        Set( varCB, LookUp( colCrewBreak, Crew = varMyCrew ) );
        Set( varBoxTitle,  If( varRole = "sponsor", "YOUR CREW", "YOUR PERFORMANCE" ) );
        Set( varBoxName,   If( varRole = "sponsor", varCB.CrewName, varMemberRec.Name ) );
        Set( varBoxSub,    If( varRole = "sponsor", "You sponsor · " & CountRows(colMyCrew) & " people", varMyCrew & " · You" ) );
        Set( varBoxTotLbl, If( varRole = "sponsor", "CREW TOTAL · EXCL PENDING", "TOTAL · EXCL PENDING" ) );
        Set( varBoxTotal,  If( varRole = "sponsor", varCB.Total,   varMemberRec.MemberTotal ) );
        Set( varBoxPending,If( varRole = "sponsor", varCB.Pending, varMemberRec.MemberPending ) );
        Set( varB1, If( varRole = "sponsor", varCB.NewCC,  varMemberRec.IBNS + varMemberRec.NewCCLogo ) );
        Set( varB2, If( varRole = "sponsor", varCB.CapEng, varMemberRec.CapReq ) );
        Set( varB3, If( varRole = "sponsor", varCB.CapOrd, varMemberRec.CapWon ) );
        Set( varB4, If( varRole = "sponsor", varCB.CC,     varMemberRec.CustCent ) );
        Set( varB5, If( varRole = "sponsor", varCB.Accred, varMemberRec.MgrPts ) );
        Set( varB6, If( varRole = "sponsor", varCB.IP,     varMemberRec.IPgl ) );

        // 7) shared SVG motion stylesheet -----------------------------------------
        Set(
            varSvgCss,
            "<style>.fu{animation:fu .55s cubic-bezier(.2,.7,.2,1) both}.fo{animation:fo .5s ease-out both}.pp{animation:pp .5s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:center}.gx{animation:gx .65s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:left center}.rw{animation:rw .5s cubic-bezier(.2,.7,.2,1) both}.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.8s ease-out infinite}.brz{animation:brz 2.6s ease-in-out infinite}.bob{transform-box:fill-box;transform-origin:center;animation:bob 2.4s ease-in-out infinite}@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes fo{from{opacity:0}to{opacity:1}}@keyframes pp{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes rw{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}@keyframes ring{0%{opacity:.45;transform:scale(.75)}70%{opacity:0;transform:scale(2)}100%{opacity:0;transform:scale(2)}}@keyframes brz{0%,100%{opacity:.9}50%{opacity:.45}}@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-2px) rotate(4deg)}}@media(prefers-reduced-motion:reduce){.fu,.fo,.pp,.gx,.rw,.ring,.brz,.scrl,.bob{animation:none}}</style>"
        );

        // 8) ready flag (drives the optional loading overlay) ---------------------
        Set( varReady, CountRows( colMembers ) > 0 );

        // 9) Order Progress (the yearly order goal that drives imgOrderAnchor) ----
        //    The model column arrives as ONE value repeated on every row, so Max()
        //    just lifts that single number out. Accepts either a 0-1 fraction or a
        //    0-100 percentage; blank/error reads as 0 so the rail always draws.
        Set( varOrderProgRaw, IfError( Coalesce( Max( PowerBIIntegration.Data, 'Order Progress' ), 0 ), 0 ) );
        Set( varOrderProgPct,
            Round( If( varOrderProgRaw > 0 && varOrderProgRaw <= 1, varOrderProgRaw * 100, varOrderProgRaw ), 0 ) );
    Children:
      - Image1:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =52
            Image: |-
              =// ============================================================================
              //  RIBBON — top app bar (NON-gallery).  Control: Image "imgRibbon"
              //  Geometry on the 1136 x 640 screen:  X=0  Y=0  Width=1136  Height=52
              //  ImagePosition = Fit
              // ============================================================================
              "data:image/svg+xml;utf8," & EncodeUrl(
                  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1136 52' font-family='Segoe UI, Arial, sans-serif'>" & varSvgCss &
                  "<g class='fu'>" &
                  "<rect x='0' y='0' width='1136' height='52' fill='#ffffff'/>" &
                  "<line x1='0' y1='51' x2='1136' y2='51' stroke='#d4d8db'/>" &
                  "<text x='54' y='32' font-size='17' font-weight='700' fill='#292d3a'>                <tspan fill='#606a70' font-weight='400'>&#183; Dashboard</tspan></text>" &
                  "<rect x='876' y='10' width='244' height='32' rx='16' fill='#f2f3f4'/>" &
                  "<circle cx='896' cy='26' r='12' fill='#01a982'/>" &
                  "<text x='896' y='27' font-size='10' font-weight='700' fill='#ffffff' text-anchor='middle' dominant-baseline='central'>" & varMyInitials & "</text>" &
                  "<text x='916' y='30' font-size='13' fill='#3e4550'>" &
                      Substitute(Substitute(Substitute(varRibbonChip,"&","&amp;"),"<","&lt;"),">","&gt;") & "</text>" &
                  "</g>" &
                  "</svg>"
              )
            Width: =1136
      - Image2:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =300
            Image: |-
              =// ============================================================================
              //  MY POINTS / CREW SUMMARY (NON-gallery).  Control: Image "imgMyPoints"
              //  Geometry: X=16  Y=68  Width=420  Height=300   ImagePosition=Fit
              //  Visible:  varRole <> "spectator"
              //  Driven by OnVisible vars: member shows personal points, sponsor shows the
              //  sponsored crew's summary (same layout, different values/labels).
              //
              //  Category re-labels: New CC Logo / IB Upsell (IB&NS + New CC Logo) ·
              //  CAP Engagement (Cap Requests) · CAP Orders Booked (Cap Won) ·
              //  Customer Centricity · Accreditation Race (Manager Sponsor) · IP Push (IP in GL)
              // ============================================================================
              "data:image/svg+xml;utf8," & EncodeUrl(
                  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 420 300' font-family='Segoe UI, Arial, sans-serif'>" & varSvgCss &
                  "<text x='4' y='16' font-size='11' font-weight='700' letter-spacing='1.2' fill='#606a70'>" & varBoxTitle & "</text>" &
                  "<g class='fu'>" &
                  "<rect x='2' y='24' width='416' height='272' rx='14' fill='#ffffff' stroke='#d4d8db'/>" &
                  "<circle cx='38' cy='60' r='18' fill='none' stroke='#01a982' stroke-width='2' class='ring' opacity='0'/>" &
                  "<g class='pp' style='animation-delay:120ms'>" &
                  "<circle cx='38' cy='60' r='18' fill='#01a982'/>" &
                  "<text x='38' y='61' font-size='14' font-weight='700' fill='#ffffff' text-anchor='middle' dominant-baseline='central'>" & varMyInitials & "</text>" &
                  "</g>" &
                  "<text x='64' y='55' font-size='15' font-weight='700' fill='#292d3a'>" & Substitute(Substitute(Substitute(varBoxName,"&","&amp;"),"<","&lt;"),">","&gt;") & "</text>" &
                  "<text x='64' y='72' font-size='11.5' fill='#606a70'>" & Substitute(Substitute(Substitute(varBoxSub,"&","&amp;"),"<","&lt;"),">","&gt;") & "</text>" &
                  "<text x='404' y='56' font-size='28' font-weight='700' fill='#006750' text-anchor='end'>" & Text(varBoxTotal) & "</text>" &
                  "<text x='404' y='71' font-size='8.5' font-weight='600' letter-spacing='.6' fill='#606a70' text-anchor='end'>" & varBoxTotLbl & "</text>" &
                  If( varBoxPending > 0,
                      "<g class='brz'><rect x='64' y='80' width='" & Text(7*Len(Text(varBoxPending))+66) & "' height='17' rx='8.5' fill='#FBEEDF'/>" &
                      "<text x='" & Text(64+(7*Len(Text(varBoxPending))+66)/2) & "' y='91' font-size='10' font-weight='600' fill='#d36d00' text-anchor='middle'>+" & Text(varBoxPending) & " pending</text></g>",
                      "" ) &
                  "<line x1='18' y1='104' x2='402' y2='104' stroke='#d4d8db'/>" &
                  Concat(
                      Table(
                          { i:0, lbl:"New CC Logo / IB Upsell", val:varB1, col:"#0070f8" },
                          { i:1, lbl:"CAP Engagement",          val:varB2, col:"#04909d" },
                          { i:2, lbl:"CAP Orders Booked",       val:varB3, col:"#009a71" },
                          { i:3, lbl:"Customer Centricity",     val:varB4, col:"#7764fc" },
                          { i:4, lbl:"Accreditation Race",      val:varB5, col:"#cc54a4" },
                          { i:5, lbl:"IP Push",                 val:varB6, col:"#d25f4b" }
                      ),
                      With(
                          { x: 18 + Mod(i,2)*198, y: 112 + Int(i/2)*62 },
                          "<g class='fo' style='animation-delay:" & Text(280 + i*70) & "ms'>" &
                          "<rect x='" & Text(x) & "' y='" & Text(y) & "' width='186' height='54' rx='10' fill='#fbfcfc' stroke='#d4d8db'/>" &
                          "<rect x='" & Text(x) & "' y='" & Text(y) & "' width='5' height='54' rx='2.5' fill='" & col & "'/>" &
                          "<circle cx='" & Text(x+20) & "' cy='" & Text(y+19) & "' r='3.5' fill='" & col & "'/>" &
                          "<text x='" & Text(x+30) & "' y='" & Text(y+22) & "' font-size='10.5' font-weight='600' fill='#606a70'>" & lbl & "</text>" &
                          "<text x='" & Text(x+16) & "' y='" & Text(y+43) & "' font-size='19' font-weight='700' fill='#292d3a'>" & Text(val) & "</text>" &
                          "</g>"
                      )
                  ) &
                  "</g></svg>"
              )
            Visible: =varRole <> "spectator"
            Width: =420
            X: =16
            Y: =68
      - Image3:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =244
            Image: |-
              =// ============================================================================
              //  IN-CREW MEMBER GRID (NON-gallery).  Control: Image "imgCrewGrid"
              //  Geometry: X=16  Y=380  Width=420  Height=244   ImagePosition=Fit
              //  Visible:  varRole <> "spectator"
              //  Tiles auto-stretch so the grid fills the box for any crew size (up to 10).
              //  Member view highlights the viewer ("YOU"); sponsor view shows the crew only.
              // ============================================================================
              With(
                  { rows: RoundUp( CountRows( colMyCrew ) / 2, 0 ) },
                  With(
                      { th: Int( (244 - 26 - (rows-1)*8) / rows ) },
                      "data:image/svg+xml;utf8," & EncodeUrl(
                          "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 420 244' font-family='Segoe UI, Arial, sans-serif'>" & varSvgCss &
                          "<text x='4' y='16' font-size='11' font-weight='700' letter-spacing='1.2' fill='#606a70'>" &
                              Substitute(Substitute(Substitute( Left(Upper(varMyCrew), 20), "&","&amp;"),"<","&lt;"),">","&gt;") & " · MEMBERS</text>" &
                          "<text x='416' y='16' font-size='11' fill='#606a70' text-anchor='end'>" & Text(CountRows(colMyCrew)) & " people</text>" &
                          Concat(
                              colMyCrew,
                              With(
                                  { x: 2 + Mod(Idx,2)*212, y: 26 + Int(Idx/2)*(th+8) },
                                  "<g class='pp' style='animation-delay:" & Text(100 + Idx*50) & "ms'>" &
                                  "<rect x='" & Text(x) & "' y='" & Text(y) & "' width='204' height='" & Text(th) & "' rx='11' fill='" & If(IsMe,"#d1ffee","#ffffff") & "' stroke='" & If(IsMe,"#01a982","#d4d8db") & "' stroke-width='" & If(IsMe,"2","1") & "'/>" &
                                  If( IsMe, "<rect x='" & Text(x) & "' y='" & Text(y) & "' width='204' height='" & Text(th) & "' rx='11' fill='none' stroke='#01a982' stroke-width='2' class='brz' opacity='0'/>", "" ) &
                                  "<text x='" & Text(x+14) & "' y='" & Text(y+22) & "' font-size='12.5' font-weight='600' fill='" & If(IsMe,"#292d3a","#3e4550") & "'>" &
                                      Substitute(Substitute(Substitute( Left(Name, 22), "&","&amp;"),"<","&lt;"),">","&gt;") & "</text>" &
                                  If( IsMe, "<text x='" & Text(x+192) & "' y='" & Text(y+21) & "' font-size='9.5' font-weight='700' letter-spacing='.5' fill='#006750' text-anchor='end'>YOU</text>", "" ) &
                                  "<text x='" & Text(x+14) & "' y='" & Text(y+th-11) & "' font-size='20' font-weight='700' fill='" & If(IsMe,"#006750","#292d3a") & "'>" & Text(MemberTotal) & "</text>" &
                                  "<text x='" & Text(x+14 + Len(Text(MemberTotal))*12 + 5) & "' y='" & Text(y+th-11) & "' font-size='11' fill='#606a70'>pts</text>" &
                                  "</g>"
                              )
                          ) &
                          "</svg>"
                      )
                  )
              )
            Visible: =varRole <> "spectator"
            Width: =420
            X: =16
            Y: =380
      - Image4:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =556
            Image: |-
              =// ============================================================================
              //  SPECTATOR TOUR (NON-gallery).  Control: Image "imgSpectator"
              //  Geometry: X=16  Y=68  Width=420  Height=556   ImagePosition=Fit
              //  Visible:  varRole = "spectator"   (email not in User Email or Manager Sponsor Email)
              //  Slowly auto-scrolls through every crew's points breakdown (CSS marquee).
              //  Scroll distance/speed scale with the number of crews. Honours reduced-motion.
              // ============================================================================
              With(
                  { n: CountRows( colCrewBreak ) },
                  With(
                      { dist: Max( 0, n*160 - 10 - 510 ), dur: Max( 24, n*4 ) },
                      "data:image/svg+xml;utf8," & EncodeUrl(
                          "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 420 556' font-family='Segoe UI, Arial, sans-serif'>" & varSvgCss &
                          "<style>.scrl{animation:scrl " & Text(dur) & "s linear infinite alternate}@keyframes scrl{from{transform:translateY(0)}to{transform:translateY(-" & Text(dist) & "px)}}@media(prefers-reduced-motion:reduce){.scrl{animation:none}}</style>" &
                          "<clipPath id='spec'><rect x='6' y='36' width='408' height='510' rx='12'/></clipPath>" &
                          "<text x='4' y='16' font-size='11' font-weight='700' letter-spacing='1.2' fill='#606a70'>ALL CREWS &#8212; LIVE TOUR</text>" &
                          "<circle cx='408' cy='12' r='4' fill='#01a982' class='brz'/>" &
                          "<text x='398' y='16' font-size='10' font-weight='600' fill='#606a70' text-anchor='end'>auto</text>" &
                          "<rect x='4' y='34' width='412' height='514' rx='14' fill='#ffffff' stroke='#d4d8db'/>" &
                          "<g clip-path='url(#spec)'><g class='scrl'>" &
                          Concat(
                              Sort( colCrewBreak, Rank ),
                              With(
                                  { yc: 42 + (Rank-1)*160,
                                    medal: Switch( Rank, 1, "#E0A300", 2, "#8C99A4", 3, "#B5742E", "#606a70" ),
                                    mbg:   Switch( Rank, 1, "#FBF1D6", 2, "#EDEFF1", 3, "#F4E9DD", "#f2f3f4" ),
                                    mx:    Max( 1, NewCC, CapEng, CapOrd, CC, Accred, IP ),
                                    v1:NewCC, v2:CapEng, v3:CapOrd, v4:CC, v5:Accred, v6:IP, tot:Total, rk:Rank,
                                    nm: Substitute(Substitute(Substitute( Left(CrewName, 24), "&","&amp;"),"<","&lt;"),">","&gt;") },
                                  "<g transform='translate(12," & Text(yc) & ")'>" &
                                  "<rect x='0' y='0' width='396' height='150' rx='12' fill='#fbfcfc' stroke='#d4d8db'/>" &
                                  "<circle cx='26' cy='28' r='15' fill='" & mbg & "' stroke='" & medal & "' stroke-width='1.5'/>" &
                                  "<text x='26' y='29' font-size='13' font-weight='700' fill='" & medal & "' text-anchor='middle' dominant-baseline='central'>" & Text(rk) & "</text>" &
                                  "<text x='50' y='24' font-size='16' font-weight='700' fill='#292d3a'>" & nm & "</text>" &
                                  "<text x='50' y='40' font-size='10.5' fill='#606a70'>rank #" & Text(rk) & "</text>" &
