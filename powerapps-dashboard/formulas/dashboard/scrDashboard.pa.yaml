              // ============================================================================
              "data:image/svg+xml;utf8," & EncodeUrl(
                  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 140 30' font-family='Segoe UI, Arial, sans-serif'>" & varSvgCss &
                  "<style>.nudge{animation:nudge 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}@media(prefers-reduced-motion:reduce){.nudge{animation:none}}</style>" &
                  "<g class='fu'>" &
                  "<rect x='1' y='1' width='138' height='28' rx='14' fill='#01a982'/>" &
                  "<rect x='1' y='1' width='138' height='14' rx='13' fill='#ffffff' opacity='.12'/>" &
                  "<g transform='translate(20,15)'><path d='M0,-7 C4,-5 4,3 0,7 C-4,3 -4,-5 0,-7 Z' fill='#ffffff' opacity='.95'/><path d='M0,-6 L0,6' stroke='#01a982' stroke-width='.8' opacity='.5'/></g>" &
                  "<text x='36' y='16' font-size='13' font-weight='600' fill='#ffffff' dominant-baseline='central'>Crew Portal</text>" &
                  "<path d='M122,11 l5,4 l-5,4' fill='none' stroke='#ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' class='nudge'/>" &
                  "</g>" &
                  "</svg>"
              )
            OnSelect: |-
              =// ============================================================================
              //  btnCrewPortal.OnSelect  —  the "Crew Portal" button on the dashboard ribbon.
              //
              //  RECOMMENDED PLACEMENT (matches the SVG design language): put the SVG button
              //  image "imgCrewPortalBtn" (see imgCrewPortalBtn.Image.powerfx) on the ribbon at
              //    X=720  Y=11  Width=140  Height=30   ImagePosition=Fit
              //  and paste THIS formula into imgCrewPortalBtn.OnSelect (Image controls are
              //  tappable — no separate Button needed).
              //
              //  ALTERNATIVE: a plain Button with this OnSelect (Text="Crew Portal",
              //  Fill=RGBA(1,169,130,1), Color=White, HoverFill=RGBA(0,103,80,1), radius 15,
              //  BorderThickness=0) — or a transparent Button laid over imgCrewPortalBtn if you
              //  want hover/press feedback on the SVG.
              //
              //  This just arms the leaf-wipe transition and navigates. The opportunity pack
              //  Collect (your pack-split formula) now runs in scrPortal.OnVisible, so it
              //  rebuilds every time the portal opens — see Screen_Portal_OnVisible.powerfx.
              //  ScreenTransition.Cover is the reliable base transition; the leaf-wipe overlay
              //  (imgLeafWipe + varLeafBusy) is the flourish on top.
              // ============================================================================
              Set( varLeafKey, varLeafKey + 1 );
