Screens:
  scrLogMeeting:
    Properties:
      Fill: =RGBA(247, 247, 247, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =// ============================================================================
        //  scrLogMeeting.OnVisible  -  Log a customer meeting (Customer Centricity).
        //
        //  DATA SOURCE: the approvals SharePoint list, added via Data > Add data.
        //  Referenced below as '1 Percent Approvals' - if your list's display name
        //  differs, change it here, in btnMeetSave, and in galMeetMine.Items.
        //  (A name containing spaces MUST stay single-quoted in Power Fx.)
        //
        //  HOW A MEETING SCORES (mirrors the Customer Centricity measures, which
        //  now read this list - see Customer_Centricity_Points.dax):
        //    1. 'Approval Type' must be EXACTLY one of the list's choices. The
        //       measures match on that string: F2F Meeting 35, Leadership Meeting
        //       20, Customer Meeting 10, Channel Partner Meeting 10.
        //    2. 'Requestor Name' must hold the logger's dashboard name - that is
        //       what the measures join on, so points find the right person.
        //    3. 'Approval Status' = "Approve" scores; BLANK = pending. The L1
        //       manager signs it off.
        //  The dropdown labels ARE the Approval Type values, so there is no
        //  mapping layer to drift out of step with the choice column.
        // ============================================================================

        // 1) the meeting types -------------------------------------------------------
        //    The four choices live in drpMeetSubject.Items; their awards live in the
        //    Switch used by imgMeetForm and imgMeetScore. FOUR PLACES must agree on
        //    these exact strings, or a meeting silently scores nothing:
        //      drpMeetSubject.Items - the Switch - the SharePoint 'Approval Type'
        //      choice column - the Customer Centricity measures.
        //        F2F Meeting 35 | Leadership Meeting 20 | Customer Meeting 10 |
        //        Channel Partner Meeting 10

        // 2) who is logging, and who approves it -------------------------------------
        //    Credit is by NAME, so varMeetMyName is what gets written. The approver is
        //    the logger's L1 manager, read straight off the model row for this user.
        Set( varMeetMyEmail, Trim( Lower( varUserEmail ) ) );
        With(
            { me: LookUp( PowerBIIntegration.Data, Trim( Lower( 'User Email' & "" ) ) = varMeetMyEmail ) },
            Set( varMeetMyName, me.Name & "" );
            Set( varMeetApprover, Trim( Lower( me.'L1 Manager Email' & "" ) ) )
        );
        // WHO MAY LOG: controlled by imgLogMeetingBtn.Visible on the Crew Portal
        // (Non S-Coded only). Deliberately NOT re-checked here - a second gate
        // keyed on a hardcoded email only ever disagreed with the first and left
        // the button greyed out with nothing on screen to explain why.

        // 3) what I have logged already (newest first) -------------------------------
        Set( varMeetSaved, false );
        ClearCollect(
            colMeetMine,
            ForAll(
                Filter( '1 Percent Approvals', 'Requestor Name' = varMeetMyName ) As r,
                {
                    MAccount:  r.'Account Name' & "",
                    MSubject:  r.'Approval Type' & "",
                    MStatus:   If( IsBlank( r.'Approval Status' & "" ), "Pending", r.'Approval Status' & "" )
                }
            )
        )
    Children:
      - imgMeetRibbon:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =52
            Image: |-
              ="data:image/svg+xml;utf8," & EncodeUrl(
                  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1136 52' font-family='Segoe UI, Arial, sans-serif'>" & varSvgCss &
                  "<g class='fu'>" &
                  "<rect x='0' y='0' width='1136' height='52' fill='#ffffff'/>" &
                  "<line x1='0' y1='51' x2='1136' y2='51' stroke='#d4d8db'/>" &
                  "<rect x='164' y='13' width='26' height='26' rx='7' fill='#7764fc'/>" &
                  "<path d='M171,26 l4,4 l8,-9' fill='none' stroke='#ffffff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/>" &
                  "<text x='202' y='32' font-size='17' font-weight='700' fill='#292d3a'>Log a meeting <tspan fill='#606a70' font-weight='400'>&#183; customer centricity points</tspan></text>" &
                  With(
                      { cw: Min( 600, Max( 150, Round( 54 + Len( varRibbonChip ) * 6.8, 0 ) ) ) },
                      With(
                          { cx: 1120 - cw },
                          "<rect x='" & Text(cx) & "' y='10' width='" & Text(cw) & "' height='32' rx='16' fill='#f2f3f4'/>" &
                          "<circle cx='" & Text(cx+20) & "' cy='26' r='12' fill='#01a982'/>" &
                          "<text x='" & Text(cx+20) & "' y='27' font-size='10' font-weight='700' fill='#ffffff' text-anchor='middle' dominant-baseline='central'>" & varMyInitials & "</text>" &
                          "<text x='" & Text(cx+40) & "' y='30' font-size='13' fill='#3e4550'>" &
                              Substitute(Substitute(Substitute(varRibbonChip,"&","&amp;"),"<","&lt;"),">","&gt;") & "</text>"
                      )
                  ) &
                  "</g>" &
                  "</svg>"
              )
            Width: =1136
            X: =0
            Y: =0
      - imgMeetBack:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =30
            Image: |-
              ="data:image/svg+xml;utf8," & EncodeUrl(
                  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 132 30' font-family='Segoe UI, Arial, sans-serif'>" & varSvgCss &
                  "<g class='fu'>" &
                  "<rect x='1' y='1' width='130' height='28' rx='14' fill='#f2f3f4' stroke='#d4d8db'/>" &
                  "<path d='M26,9 l-6,6 l6,6' fill='none' stroke='#006750' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/>" &
                  "<text x='40' y='16' font-size='12.5' font-weight='600' fill='#006750' dominant-baseline='central'>Crew Portal</text>" &
                  "</g>" &
                  "</svg>"
              )
            OnSelect: =Navigate( scrPortal, ScreenTransition.UnCover )
            Width: =132
            X: =16
            Y: =11
      - imgMeetForm:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =556
            Image: |-
              ="data:image/svg+xml;utf8," & EncodeUrl(
                  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 672 556' font-family='Segoe UI, Arial, sans-serif'>" & varSvgCss &
                  "<g class='fu'>" &
                  "<rect x='0' y='0' width='672' height='556' rx='14' fill='#ffffff' stroke='#d4d8db'/>" &
                  "<rect x='0' y='0' width='6' height='556' fill='#7764fc'/>" &
                  "<text x='32' y='42' font-size='19' font-weight='700' fill='#292d3a'>Log a customer meeting</text>" &
                  "<text x='32' y='64' font-size='12' fill='#606a70'>Goes to your L1 manager for weekly approval. Points land once approved.</text>" &
                  "<line x1='32' y1='84' x2='640' y2='84' stroke='#eceef0'/>" &
                  "<text x='32' y='100' font-size='12.5' font-weight='600' fill='#3e4550'>Account <tspan fill='#c0392b'>*</tspan></text>" &
                  "<text x='32' y='160' font-size='12.5' font-weight='600' fill='#3e4550'>Opportunity <tspan fill='#8a9096' font-weight='400'>(optional - OPE number if there is one)</tspan></text>" &
                  "<text x='32' y='220' font-size='12.5' font-weight='600' fill='#3e4550'>Meeting type <tspan fill='#c0392b'>*</tspan></text>" &
                  "<text x='32' y='284' font-size='12.5' font-weight='600' fill='#3e4550'>Notes for your approver <tspan fill='#c0392b'>*</tspan> <tspan fill='#8a9096' font-weight='400'>(your manager needs this context to approve it)</tspan></text>" &
                  "<rect x='32' y='396' width='608' height='40' rx='8' fill='#f7f6ff' stroke='#d9d3ff'/>" &
                  "<text x='48' y='412' font-size='10' font-weight='700' letter-spacing='.6' fill='#5b4bd6'>APPROVAL TYPE WRITTEN TO SHAREPOINT</text>" &
                  "<text x='48' y='429' font-size='12.5' font-weight='600' fill='#292d3a'>" &
                      Substitute(Substitute(Substitute(
                          If( IsBlank( drpMeetSubject.Selected.Value ), "pick a meeting type above",
                              drpMeetSubject.Selected.Value & "   (" & Text( Switch( drpMeetSubject.Selected.Value,
                              "F2F Meeting", 35,
                              "Leadership Meeting", 20,
                              "Customer Meeting", 10,
                              "Channel Partner Meeting", 10, 0 ) ) & " points)" ),
                          "&","&amp;"),"<","&lt;"),">","&gt;") & "</text>" &
                  "<text x='32' y='450' font-size='11.5' fill='#606a70'>Approver (your L1 manager): <tspan font-weight='600' fill='#3e4550'>" &
                      Substitute(Substitute(Substitute(
                          If( IsBlank( varMeetApprover ), "not set on your record", varMeetApprover ),
                          "&","&amp;"),"<","&lt;"),">","&gt;") & "</tspan></text>" &
                  "<text x='32' y='466' font-size='11.5' fill='#606a70'>Requestor Name (points find you by this): <tspan font-weight='600' fill='#3e4550'>" &
                      Substitute(Substitute(Substitute( varMeetMyName & "", "&","&amp;"),"<","&lt;"),">","&gt;") & "</tspan></text>" &
                  "</g>" &
                  "</svg>"
              )
            Width: =672
            X: =16
            Y: =68
      - txtMeetAccount:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(212, 216, 219, 1)
            Default: =""
            Fill: =RGBA(251, 252, 252, 1)
            Font: =Font.'Open Sans'
            Height: =36
            HintText: ="Customer / account name"
            Size: =12
            Width: =608
            X: =48
            Y: =176
      - txtMeetOpp:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(212, 216, 219, 1)
            Default: =""
            Fill: =RGBA(251, 252, 252, 1)
            Font: =Font.'Open Sans'
            Height: =36
            HintText: ="OPE-000000000 (leave blank if none)"
            Size: =12
            Width: =608
            X: =48
            Y: =236
      - drpMeetSubject:
          Control: Classic/DropDown@2.3.1
          Properties:
            BorderColor: =RGBA(212, 216, 219, 1)
            Color: =RGBA(41, 45, 58, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =40
            Items: =["Customer Meeting", "F2F Meeting", "Channel Partner Meeting", "Leadership Meeting"]
            Size: =13
            Width: =608
            X: =48
            Y: =296
      - txtMeetNotes:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(212, 216, 219, 1)
            Default: =""
            Fill: =RGBA(251, 252, 252, 1)
            Font: =Font.'Open Sans'
            Height: =92
            HintText: ="Who you met, what was discussed, any outcome - your manager needs this to approve it"
            Mode: =TextMode.MultiLine
            Size: =12
            Width: =608
            X: =48
            Y: =360
      - btnMeetClear:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(212, 216, 219, 1)
            Color: =RGBA(62, 69, 80, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            HoverColor: =RGBA(62, 69, 80, 1)
            HoverFill: =RGBA(242, 243, 244, 1)
            OnSelect: |-
              =Reset( txtMeetAccount ); Reset( txtMeetOpp ); Reset( drpMeetSubject );
              Reset( txtMeetNotes );
              Set( varMeetSaved, false )
            Height: =44
            Size: =14
            Text: ="Clear"
            Width: =150
            X: =48
            Y: =556
      - btnMeetSave:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(119, 100, 252, 1)
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: |-
              =If( !IsBlank( Trim( txtMeetAccount.Text ) )
                   && !IsBlank( drpMeetSubject.Selected.Value )
                   && !IsBlank( Trim( txtMeetNotes.Text ) ),
                   DisplayMode.Edit, DisplayMode.Disabled )
            Fill: =RGBA(119, 100, 252, 1)
            Font: =Font.'Open Sans'
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(91, 75, 214, 1)
            OnSelect: |-
              =// ============================================================================
              //  Writes one approval row. 'Approval Type' and 'Requestor Name' are
              //  the two that matter: the Customer Centricity measures match on the
              //  Approval Type string and join on the Requestor Name, so a typo in
              //  either silently scores zero.
              //
              //  'Approval Status' is deliberately NOT written. The Pending measure
              //  tests = BLANK(), and an empty string is NOT blank in DAX - writing ""
              //  would drop the row out of BOTH measures. Leaving the column unset
              //  keeps it genuinely null (and a Choice column rejects "" anyway).
              //
              //  FIELD NAMES verified against the list: HPE Opportunity ID (capital
              //  ID) - Account Name - Approval Type - Requestor Name - Notes -
              //  Opportunity Name - Approver - Approval Status.
              //  'Opportunity Name' is left unwritten (nothing on this screen
              //  captures it); 'Created Date' is SharePoint's own stamp.
              //
              //  If 'Approver' is a PERSON column rather than text, swap that line for:
              //    Approver: { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
              //                Claims: "i:0#.f|membership|" & varMeetApprover,
              //                DisplayName: varMeetApprover, Email: varMeetApprover },
              // ============================================================================
              IfError(
                  Patch(
                      '1 Percent Approvals',
                      Defaults( '1 Percent Approvals' ),
                      {
                          'Account Name':        Trim( txtMeetAccount.Text ),
                          'HPE Opportunity ID':  Trim( txtMeetOpp.Text ),
                          'Approval Type':       drpMeetSubject.Selected.Value,
                          'Requestor Name':      varMeetMyName,
                          Notes:                 Trim( txtMeetNotes.Text ),
                          Approver:              varMeetApprover
                      }
                  ),
                  Notify( "Couldn't log that meeting: " & FirstError.Message, NotificationType.Error ),
                  Collect( colMeetMine,
                      { MAccount: Trim( txtMeetAccount.Text ),
                        MSubject: drpMeetSubject.Selected.Value,
                        MStatus:  "Pending" } );
                  Notify( "Logged - sent to your L1 manager for approval.", NotificationType.Success );
                  Set( varMeetSaved, true );
                  Reset( txtMeetAccount ); Reset( txtMeetOpp ); Reset( drpMeetSubject );
                  Reset( txtMeetNotes )
              )
            Height: =44
            Size: =14
            Text: ="Log meeting"
            Width: =200
            X: =488
            Y: =556
      - imgMeetScore:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =270
            Image: |-
              ="data:image/svg+xml;utf8," & EncodeUrl(
                  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 416 270' font-family='Segoe UI, Arial, sans-serif'>" & varSvgCss &
                  With(
                      { pts: Switch( drpMeetSubject.Selected.Value,
                                    "F2F Meeting", 35,
                                    "Leadership Meeting", 20,
                                    "Customer Meeting", 10,
                                    "Channel Partner Meeting", 10, 0 ),
                        hasAcc: !IsBlank( Trim( txtMeetAccount.Text ) ),
                        hasSub: !IsBlank( drpMeetSubject.Selected.Value ),
                        hasNotes: !IsBlank( Trim( txtMeetNotes.Text ) ) },
                      "<g class='fu'>" &
                      "<rect x='0' y='0' width='416' height='270' rx='14' fill='#ffffff' stroke='#d4d8db'/>" &
                      "<text x='24' y='30' font-size='11' font-weight='700' letter-spacing='1.1' fill='#606a70'>THIS MEETING IS WORTH</text>" &
                      "<text x='24' y='76' font-size='38' font-weight='700' fill='" & If( pts > 0, "#7764fc", "#c9ced2" ) & "'>" & Text( pts ) & "</text>" &
                      "<text x='" & Text( 34 + 22*Len(Text(pts)) ) & "' y='76' font-size='13' font-weight='600' fill='#8a9096'>points</text>" &
                      "<text x='24' y='98' font-size='11' fill='#8a9096'>" &
                          If( pts > 0, "once your L1 manager approves it", "pick a meeting type to see the award" ) & "</text>" &
                      "<line x1='24' y1='116' x2='392' y2='116' stroke='#eceef0'/>" &
                      "<text x='24' y='138' font-size='10' font-weight='700' letter-spacing='.8' fill='#606a70'>TO SCORE, ALL OF THESE MUST BE TRUE</text>" &
                      With(
                          { tick: "<path d='M0,0 l3.5,3.5 l7,-8' fill='none' stroke='#01a982' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/>",
                            dot:  "<circle cx='4' cy='0' r='3.5' fill='none' stroke='#c9ced2' stroke-width='2'/>" },
                          Concat(
                              Table(
                                  { i:0, ok: hasAcc, t: "An account is filled in" },
                                  { i:1, ok: hasSub, t: "A meeting type is chosen (writes Approval Type)" },
                                  { i:2, ok: !IsBlank( varMeetMyName ), t: "Your name goes on as Requestor Name" },
                                  { i:3, ok: !IsBlank( varMeetApprover ), t: "An L1 manager is set to approve it" },
                                  { i:4, ok: hasNotes, t: "Notes are written for your manager to read" }
                              ),
                              "<g transform='translate(26," & Text( 162 + i*22 ) & ")'>" &
                              If( ok, tick, dot ) &
                              "<text x='20' y='4' font-size='11' fill='" & If( ok, "#3e4550", "#8a9096" ) & "'>" & t & "</text>" &
                              "</g>"
                          )
                      ) &
                      "</g>"
                  ) &
                  "</svg>"
              )
            Width: =416
            X: =704
            Y: =68
      - imgMeetMineHead:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =26
            Image: |-
              ="data:image/svg+xml;utf8," & EncodeUrl(
                  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 416 26' font-family='Segoe UI, Arial, sans-serif'>" & varSvgCss &
                  "<g class='fo'>" &
                  "<text x='4' y='17' font-size='11' font-weight='700' letter-spacing='1.1' fill='#606a70'>WHAT YOU HAVE LOGGED</text>" &
                  "<text x='412' y='17' font-size='11' fill='#606a70' text-anchor='end'>" & Text( CountRows( colMeetMine ) ) & " total</text>" &
                  "</g>" &
                  "</svg>"
              )
            Width: =416
            X: =704
            Y: =354
      - galMeetMine:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =236
            Items: =colMeetMine
            TemplatePadding: =0
            TemplateSize: =56
            Width: =420
            X: =704
            Y: =388
          Children:
            - imgMeetMineRow:
                Control: Image@2.2.3
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Height: =56
                  Image: |-
                    ="data:image/svg+xml;utf8," & EncodeUrl(
                        "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 416 56' font-family='Segoe UI, Arial, sans-serif'>" & varSvgCss &
                        With(
                            { ok: ThisItem.MStatus = "Approve" },
                            "<g class='rw'>" &
                            "<rect x='2' y='3' width='412' height='50' rx='10' fill='#ffffff' stroke='#d4d8db'/>" &
                            "<rect x='2' y='3' width='4' height='50' rx='2' fill='" & If( ok, "#01a982", "#d36d00" ) & "'/>" &
                            "<text x='18' y='24' font-size='12' font-weight='700' fill='#292d3a'>" &
                                Substitute(Substitute(Substitute( Left( ThisItem.MAccount, 30 ), "&","&amp;"),"<","&lt;"),">","&gt;") & "</text>" &
                            "<text x='18' y='42' font-size='10.5' fill='#8a9096'>" &
                                Substitute(Substitute(Substitute( Left( ThisItem.MSubject, 38 ), "&","&amp;"),"<","&lt;"),">","&gt;") & "</text>" &
                            "<rect x='306' y='16' width='96' height='24' rx='12' fill='" & If( ok, "#e8f7f1", "#FBEEDF" ) & "'/>" &
                            "<text x='354' y='28' font-size='10.5' font-weight='700' fill='" & If( ok, "#006750", "#d36d00" ) &
                                "' text-anchor='middle' dominant-baseline='central'>" & If( ok, "APPROVED", "PENDING" ) & "</text>" &
                            "</g>" &
                            "</svg>"
                        )
                    )
                  Width: =416
