      - btnCareNoContact:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(216, 168, 168, 1)
            Color: =RGBA(158, 42, 42, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            HoverColor: =RGBA(158, 42, 42, 1)
            HoverFill: =RGBA(250, 240, 240, 1)
            OnSelect: |-
              =// ============================================================================
              //  "Rep says do not contact" - clears this opportunity off the call list.
              //  No new column: the reason goes into the existing 'Follow-up Notes' field
              //  and 'Response Date' stamps it as actioned, which is what takes it off the
              //  list (the list hides any opportunity already present in the SharePoint
              //  list). Anything typed in the notes box is appended.
              // ============================================================================
              IfError(
                  Patch(
                      'HPE Services Post Renewal Questionnaire',
                      Defaults( 'HPE Services Post Renewal Questionnaire' ),
                      {
                          Account:         varCareOpp.AccountName,
                          Opportunity:     varCareOpp.OppId,
                          'Renewal Rep':   varCareOpp.OwnerName,
                          'Renewal Date':  DateValue( varCareOpp.CloseDate ),
                          'Response Date': Today(),
                          'Follow-up Notes':
                              "DO NOT CONTACT - the aligned sales rep advised against contacting this customer." &
                              If( !IsBlank( Trim( txtCareNotes.Text ) ), " Note: " & txtCareNotes.Text, "" )
                      }
                  ),
                  Notify( "Couldn't clear that one: " & FirstError.Message, NotificationType.Error ),
                  Collect( colCareDone, { OppKey: varCareOpp.OppId } );
                  Notify( "Cleared - that opportunity is off your call list.", NotificationType.Success );
                  Set( varCareOpp, Blank() );
                  Set( varCareStep, 1 )
              )
            Height: =44
            Size: =13
            Text: ="Rep says do not contact"
            Visible: =!IsBlank( varCareOpp )
            Width: =250
            X: =48
            Y: =556
