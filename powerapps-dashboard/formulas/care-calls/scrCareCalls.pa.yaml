            Mode: =TextMode.MultiLine
            Size: =12
            Visible: =!IsBlank( varCareOpp )
            Width: =504
            X: =48
            Y: =180
      - txtCareQ2:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(212, 216, 219, 1)
            Default: =""
            Fill: =RGBA(251, 252, 252, 1)
            Font: =Font.'Open Sans'
            Height: =148
            HintText: ="Note anything to follow up..."
            Mode: =TextMode.MultiLine
            Size: =12
            Visible: =!IsBlank( varCareOpp )
            Width: =504
            X: =48
            Y: =400
      - drpCareQ3:
          Control: Classic/DropDown@2.3.1
          Properties:
            BorderColor: =RGBA(212, 216, 219, 1)
            Color: =RGBA(41, 45, 58, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =44
            Items: =["Not started", "In progress", "Completed", "Blocked"]
            Size: =13
            Visible: =!IsBlank( varCareOpp )
            Width: =504
            X: =584
            Y: =180
      - drpCareQ4:
          Control: Classic/DropDown@2.3.1
          Properties:
            BorderColor: =RGBA(212, 216, 219, 1)
            Color: =RGBA(41, 45, 58, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =44
            Items: =["Yes", "Maybe", "No", "Too early to tell"]
            Size: =13
            Visible: =!IsBlank( varCareOpp )
            Width: =504
            X: =584
            Y: =280
      - sldCareQ5:
          Control: Classic/Slider@1.0.31
          Properties:
            Default: =3
            HandleFill: =RGBA(1, 169, 130, 1)
            Height: =24
            Max: =5
            Min: =1
            RailFill: =RGBA(224, 227, 230, 1)
            ShowValue: =false
            ValueFill: =RGBA(1, 169, 130, 1)
            Visible: =!IsBlank( varCareOpp )
            Width: =430
            X: =584
            Y: =384
      - imgCareSliderVal:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =40
            Image: |-
              ="data:image/svg+xml;utf8," & EncodeUrl(
                  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 40' font-family='Segoe UI, Arial, sans-serif'>" &
                  "<rect x='2' y='6' width='52' height='28' rx='14' fill='#e8f7f1' stroke='#01a982'/>" &
                  "<text x='28' y='21' font-size='15' font-weight='700' fill='#006750' text-anchor='middle' dominant-baseline='central'>" & Text( sldCareQ5.Value ) & "</text>" &
                  "</svg>"
              )
            Visible: =!IsBlank( varCareOpp )
            Width: =56
            X: =1032
            Y: =372
      - btnCareCancel:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(212, 216, 219, 1)
            Color: =RGBA(62, 69, 80, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            HoverColor: =RGBA(62, 69, 80, 1)
            HoverFill: =RGBA(242, 243, 244, 1)
            OnSelect: |-
              =Reset( txtCareQ1 );
              Reset( txtCareQ2 );
              Reset( drpCareQ3 );
              Reset( drpCareQ4 );
              Reset( sldCareQ5 );
              Set( varCareOpp, Blank() )
            Height: =44
            Size: =14
            Text: ="Cancel"
            Visible: =!IsBlank( varCareOpp )
            Width: =150
            X: =740
            Y: =556
      - btnCareSave:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(1, 169, 130, 1)
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(1, 169, 130, 1)
            Font: =Font.'Open Sans'
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 103, 80, 1)
            OnSelect: |-
              =// TODO (SharePoint): when the list exists, Patch the answers here, e.g.
              // Patch( CareCallResponses, Defaults( CareCallResponses ),
              //     { OppId: varCareOpp.OppId, OppName: varCareOpp.OppName,
              //       Respondent: varUserEmail,
              //       Q1: txtCareQ1.Text, Q2: txtCareQ2.Text,
              //       Q3: drpCareQ3.Selected.Value, Q4: drpCareQ4.Selected.Value,
              //       Q5: sldCareQ5.Value, SubmittedOn: Now() } );
              // For now, just close the survey and return to the opp list:
              Reset( txtCareQ1 );
              Reset( txtCareQ2 );
              Reset( drpCareQ3 );
              Reset( drpCareQ4 );
              Reset( sldCareQ5 );
              Set( varCareOpp, Blank() )
            Height: =44
            Size: =14
            Text: ="Save & close"
            Visible: =!IsBlank( varCareOpp )
            Width: =184
            X: =904
            Y: =556
