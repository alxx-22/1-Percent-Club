      - btnCareSave:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(1, 169, 130, 1)
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(1, 169, 130, 1)
            Font: =Font.'Open Sans'
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 103, 80, 1)
            OnSelect: |-
              =// ============================================================================
              //  Writes one row to the SharePoint list 'HPE Services Post Renewal Questionnaire'
              //  using the questionnaire's own column names. Account / Opportunity /
              //  Renewal Rep / Renewal Date come from the opportunity, Response Date is
              //  stamped now, and the answers come from the inputs. Once written, the
              //  opportunity drops off the call list.
              //
              //  If your list requires the built-in Title column, add:  Title: varCareOpp.OppId,
              //  If 'Open to a mapping session? (Yes/No)' is a CHOICE column (not text),
              //  use:  { Value: drpCareMap.Selected.Value }
              // ============================================================================
              IfError(
                  Patch(
                      'HPE Services Post Renewal Questionnaire',
                      Defaults( 'HPE Services Post Renewal Questionnaire' ),
                      {
                          Account:          varCareOpp.AccountName,
                          Opportunity:      varCareOpp.OppId,
                          'Contact Name':   txtCareContact.Text,
                          'Contact Email':  txtCareEmail.Text,
                          'Renewal Rep':    varCareOpp.OwnerName,
                          'Renewal Date':   DateValue( varCareOpp.CloseDate ),
                          'Response Date':  Today(),
                          'Q1 - Alignment of renewal outcome with priorities and goals':          txtCareQ1.Text,
                          'Q2 - Differences noticed in how services support day-to-day operations': txtCareQ2.Text,
                          'Q3 - Most valuable aspects of the renewed services or engagement':     txtCareQ3.Text,
                          'Q4 - Areas where services or support could be better aligned':         txtCareQ4.Text,
                          'Q5 - Working relationship with the HPE team since renewal':            txtCareQ5.Text,
                          'Q6 - Upcoming changes or initiatives we should be aware of':           txtCareQ6.Text,
                          'Q7 - What success with HPE looks like by the next renewal':            txtCareQ7.Text,
                          'Open to a mapping session? (Yes/No)': drpCareMap.Selected.Value,
                          'Follow-up Notes': txtCareNotes.Text
                      }
                  ),
                  Notify( "Couldn't save that response: " & FirstError.Message, NotificationType.Error ),
                  Collect( colCareDone, { OppKey: varCareOpp.OppId } );
                  Notify( "Saved - thanks. That opportunity is now off your call list.", NotificationType.Success );
                  Set( varCareOpp, Blank() );
                  Set( varCareStep, 1 )
              )
            Height: =44
            Size: =14
            Text: ="Save & close"
            Visible: =!IsBlank( varCareOpp ) && varCareStep = 2
            Width: =184
            X: =904
            Y: =556
