# Paste into scrPortal's Children (same indent as its other controls).
# Testing lock: visible only to alex.cohen@hpe.com. The production
# 'S Coded?' gate is kept commented inside imgCareCallsBtn.Visible.powerfx.
      - imgCareCallsBtn:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =30
            Image: |-
              ="data:image/svg+xml;utf8," & EncodeUrl(
                  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 30' font-family='Segoe UI, Arial, sans-serif'>" & varSvgCss &
                  "<g class='fu'>" &
                  "<rect x='1' y='1' width='198' height='28' rx='14' fill='#01a982' stroke='#01a982'/>" &
                  "<circle cx='20' cy='15' r='9' fill='#ffffff' opacity='0.18'/>" &
                  "<text x='20' y='16' font-size='9' font-weight='700' fill='#ffffff' text-anchor='middle' dominant-baseline='central'>CC</text>" &
                  "<text x='38' y='16' font-size='12.5' font-weight='700' fill='#ffffff' dominant-baseline='central'>Customer Care Calls</text>" &
                  "</g>" &
                  "</svg>"
              )
            OnSelect: =Navigate( scrCareCalls, ScreenTransition.Cover )
            Visible: |-
              =// TESTING LOCK -- only this tester can see/use the screen for now.
              // Real signed-in email (User().Email); varUserEmail is remapped for some
              // accounts in the dashboard build, so match the literal here. When testing
              // is done, delete the active line and un-comment the S-Coded gate below.
              Lower( User().Email ) = "alex.cohen@hpe.com"
              // PRODUCTION GATE (re-enable after testing):
              // LookUp(
              //     PowerBIIntegration.Data,
              //     Trim( Lower( 'User Email' & "" ) ) = Trim( varUserEmail )
              // ).'S Coded?' = "Non S-Coded (Phil)"
            Width: =200
            X: =160
            Y: =11
